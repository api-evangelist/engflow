  registry: pkg.go.dev
  name: github.com/EngFlow/engflowapis/go
  url: https://pkg.go.dev/github.com/EngFlow/engflowapis
  install: go get github.com/EngFlow/engflowapis/go
  official: true
  description: >-
    Generated Go bindings for EngFlow's Protocol Buffer API interface
    definitions (cluster, iam, authentication, eventstore, resultstore, secret,
    notification, resourceusage services).
