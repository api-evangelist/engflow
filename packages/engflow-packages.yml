notes: >-
  EngFlow's client surface is Bazel + the open Remote Execution API; there is no
  conventional REST SDK. First-party, officially-published Go modules from the
  EngFlow GitHub org are catalogued here. The Protocol Buffer interface
  definitions (engflowapis) ship generated Go bindings under the /go module path.
  No first-party packages were found on npm, PyPI, Maven Central, NuGet,
  RubyGems, Packagist, or crates.io (probed 2026-07-19).
packages:
