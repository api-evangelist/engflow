apis:
- name: EngFlow Cluster API (gRPC)
  description: >-
    The EngFlow cluster gRPC / Protocol Buffers API surface — cluster info, IAM
    (roles/policies/users/groups), authentication, event store and result store
    build-event streaming, secret management, and notifications — as published in
    the EngFlow/engflowapis interface-definition repository, alongside the open
    Remote Execution API (REAPI v2) and Remote Asset API that EngFlow implements.
  humanURL: https://docs.engflow.com/re/index.html
  baseURL: https://docs.engflow.com
  x-transport: grpc
  x-note: >-
    EngFlow clusters are customer-hosted; the gRPC endpoint is per-cluster
    (grpcs://<cluster-host>). No single public base URL exists — humanURL/baseURL
    point at the public developer docs host.
  properties:
  - type: Protobuf
    name: Cluster service (proto)
    url: grpc/engflow-cluster.proto
  - type: Protobuf
    name: Identity and Access Management service (proto)
    url: grpc/engflow-identity_and_access_management.proto
  - type: Protobuf
    name: Authentication service (proto)
    url: grpc/engflow-authentication.proto
  - type: Protobuf
    name: Event Store service (proto)
    url: grpc/engflow-eventstore.proto
  - type: Protobuf
    name: Result Store service (proto)
    url: grpc/engflow-resultstore.proto
  - type: Protobuf
    name: Secret service (proto)
    url: grpc/engflow-secret.proto
  - type: Protobuf
    name: Notification service (proto)
    url: grpc/engflow-notification.proto
