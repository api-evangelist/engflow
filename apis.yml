aid: engflow
name: EngFlow
description: >-
  EngFlow provides remote build execution, remote caching, CI runners, and a
  Build & Test UI that accelerate large-scale software builds for Bazel,
  BuildStream, Goma, Pants, Soong, CMake, and Buck2. EngFlow clusters expose a
  gRPC / Protocol Buffers API surface — the open Remote Execution API (REAPI v2)
  and Remote Asset API, plus EngFlow's own cluster, IAM, authentication, event
  store, result store, secret, notification, and resource-usage services, all
  published as Protocol Buffer interface definitions in the EngFlow/engflowapis
  repository. Clusters authenticate via mTLS, cluster-issued JWT bearer tokens,
  OIDC federation, SAML, GitHub tokens, and basic auth, and provision users over
  SCIM 2.0. EngFlow was founded by former Google/Bazel engineers and is backed by
  a16z.
